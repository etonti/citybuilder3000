    - name: Dependency Vulnerability Scan
      run: |
        echo "🛡️ Scan des vulnérabilités des dépendances..."
        # Vérification des versions vulnérables
        npx npm-audit-html || true
        
        # Vérification des licences
        npx license-checker --summary || true
    
    - name: Code Security Analysis
      run: |
        echo "🔍 Analyse de sécurité du code..."
        
        # Recherche de patterns dangereux
        if grep -r "eval(" . --include="*.js" --exclude-dir=node_modules; then
          echo "⚠️  Attention: utilisation de eval() détectée"
        else
          echo "✅ Aucun eval() détecté"
        fi
        
        # Vérification des URLs non sécurisées
        if grep -r "http://" . --include="*.js" --exclude-dir=node_modules | grep -v "http://localhost"; then
          echo "⚠️  Attention: URLs HTTP non locales détectées"
        else
          echo "✅ Aucune URL HTTP externe détectée"
        fi
        
        # Vérification des clés API en clair
        if grep -r "api_key\|apikey\|secret" . --include="*.js" --exclude-dir=node_modules | grep -v "test\|example"; then
          echo "⚠️  Attention: clés potentielles détectées dans le code"
        else
          echo "✅ Aucune clé API détectée"
        fi
    
    - name: Bundle Security Check
      run: |
        echo "📦 Analyse de sécurité du bundle..."
        if [ -d "dist" ]; then
          # Vérifier la présence de fichiers sensibles
          find dist/ -name "*.map" -o -name "*.env" | while read file; do
            echo "⚠️  Fichier potentiellement sensible: $file"
          done
        fi

