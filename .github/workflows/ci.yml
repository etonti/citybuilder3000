name: CI/CD for City Builder Client

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project with Vite
      run: npm run build
    
    - name: Run preview server (smoke test)
      run: |
        npm run build
        timeout 30s npm run preview &
        sleep 10
        curl -f http://localhost:4173 || exit 0
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: city-builder-build-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit
      run: npm audit --audit-level moderate
    
    - name: Check for sensitive data
      uses: gitleaks/gitleaks-action@v2
      with:
        config-path: .gitleaks.toml

  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [install-and-build, security-audit]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: city-builder-build-20.x
        path: dist
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Deploy to preview
      run: |
        echo "Deploying preview for PR #${{ github.event.number }}"
        echo "Build artifacts are available in ./dist"
        # Uncomment and configure your preview deployment:
        # - Netlify: npx netlify-cli deploy --dir=dist --alias=pr-${{ github.event.number }}
        # - Vercel: npx vercel --prebuilt --prod
        # - GitHub Pages: cp -r dist/* ./ && git add . && git commit -m "Deploy preview" && git push

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [install-and-build, security-audit]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: city-builder-build-20.x
        path: dist
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Deploy to production
      run: |
        echo "Deploying to production"
        echo "Production build ready in ./dist"
        # Uncomment and configure your production deployment:
        # - Netlify: npx netlify-cli deploy --dir=dist --prod
        # - Vercel: npx vercel --prebuilt --prod
        # - GitHub Pages: 
        #   git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        #   npx gh-pages -d dist -u "github-actions-bot <support+actions@github.com>"